[package]
name = "rustmt5"
version = "0.1.0"
edition = "2021"
description = "Async Rust client for the MetaTrader 5 Web Terminal binary WebSocket protocol (port of cloudQuant/pymt5)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/neverlock/rustmt5"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
aes = "0.8"
cbc = { version = "0.1", features = ["block-padding", "alloc"] }
thiserror = "2"
tracing = "0.1"
rand = "0.9"
sha1 = "0.10"
flate2 = "1"
indexmap = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
